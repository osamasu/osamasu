name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#ff5a3c&color_dots=#161b22,#3d1209,#6e1f12,#93291a,#B8341E

      # snk only supports a background colour for GIFs, so paint one behind
      # the SVG to keep it dark when the profile is viewed in light mode.
      - name: Add dark background
        run: |
          sed -i -E 's#(<svg viewBox="([-0-9.]+) ([-0-9.]+) ([0-9.]+) ([0-9.]+)"[^>]*>)#\1<rect x="\2" y="\3" width="\4" height="\5" rx="12" fill="\#0d1117"/>#' dist/github-snake-dark.svg
          grep -q '<rect x=' dist/github-snake-dark.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
